<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🏠 우리 생활비</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5EFE6;--surface:#FFFCF8;--dark:#1E1A17;--muted:#A09890;
  --lite:#EAE3D8;--coral:#C4622E;--coral-light:#F0D5C5;
  --lg:#2B5FB8;--lg-light:#C8D9F5;
  --green:#2E8B57;--green-light:#C5E8D5;
  --red:#D63030;--red-light:#FAD5D5;
  --ff:'Noto Sans KR',sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:var(--ff);color:var(--dark);font-size:14px;display:flex;flex-direction:column}

/* ── 스크롤 ── */
.scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ── 헤더 ── */
#header{background:var(--dark);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:50}
#header .title{color:#F5EFE6;font-size:15px;font-weight:700;letter-spacing:-.3px}
#header .month-nav{display:flex;align-items:center;gap:4px}
#header .month-nav button{background:none;border:none;color:#666;font-size:22px;cursor:pointer;padding:4px 6px;line-height:1;font-family:var(--ff)}
#header .month-nav span{color:#F5EFE6;font-size:13px;font-weight:600;min-width:72px;text-align:center}
.sync-btn{background:none;border:none;cursor:pointer;color:#666;font-size:12px;display:flex;align-items:center;gap:4px;font-family:var(--ff);padding:4px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#3A9960;flex-shrink:0;transition:background .3s}
.sync-dot.syncing{background:#F0A030;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── 탭 ── */
#tabs{background:var(--surface);border-top:1px solid var(--lite);display:flex;flex-shrink:0}
.tab{flex:1;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;font-family:var(--ff);color:var(--muted);transition:color .2s;font-size:10px;font-weight:500}
.tab .tab-icon{font-size:18px;line-height:1}
.tab.active{color:var(--coral)}
.tab.active .tab-icon{transform:scale(1.1)}

/* ── 카드 ── */
.card{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid rgba(0,0,0,.04)}
.card-dark{background:var(--dark);border-radius:20px;padding:22px 22px 18px;margin-bottom:12px;position:relative;overflow:hidden}

/* ── 히어로 ── */
.hero-deco{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.05)}
.hero-label{color:var(--muted);font-size:11px;letter-spacing:.4px;margin-bottom:5px}
.hero-amount{color:#F5EFE6;font-size:38px;font-weight:900;letter-spacing:-2px;line-height:1;margin-bottom:4px}
.hero-amount span{font-size:18px;font-weight:400;letter-spacing:0}
.hero-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.hero-sub .green{color:#5AB88A}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero-chip{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.hero-chip .chip-label{color:#666;font-size:10px;margin-bottom:3px}
.hero-chip .chip-val{color:#F5EFE6;font-size:15px;font-weight:700}
.hero-chip .chip-val.warn{color:#FF9090}
.hero-chip .chip-warn{color:#FF9090;font-size:9px;margin-top:2px}

/* ── 카드 기준 바 ── */
.budget-bar{margin-top:10px}
.budget-bar-track{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden;margin-bottom:4px}
.budget-bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.budget-bar-label{color:#555;font-size:9px;display:flex;justify-content:space-between}

/* ── 개인정산 배너 ── */
.refund-banner{background:var(--green-light);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.refund-banner .left .title{font-size:12px;color:var(--green);font-weight:700;margin-bottom:3px}
.refund-banner .left .detail{font-size:11px;color:#666}
.refund-banner .amount{font-size:18px;font-weight:700;color:var(--green)}

/* ── 차트 ── */
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.chart-title{font-size:13px;font-weight:700}
.chart-link{font-size:12px;color:var(--coral);font-weight:700;cursor:pointer;border:none;background:none;font-family:var(--ff)}

/* ── 필터 칩 ── */
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-bottom:10px}
.filter-row::-webkit-scrollbar{display:none}
.chip{border:none;background:var(--surface);color:var(--muted);border-radius:20px;padding:5px 13px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:var(--ff);font-weight:400;flex-shrink:0;transition:all .15s}
.chip.active{background:var(--dark);color:#F5EFE6;font-weight:700}

/* ── 지출 항목 ── */
.expense-item{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer;border:1px solid var(--lite);transition:transform .1s,box-shadow .1s;-webkit-user-select:none;user-select:none}
.expense-item:active{transform:scale(.98)}
.expense-item.personal{background:var(--green-light);border-color:#AADDC0}
.expense-icon{width:40px;height:40px;border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.expense-info{flex:1;min-width:0}
.expense-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px;margin-bottom:3px}
.personal-badge{font-size:10px;background:#B8E8CA;color:#1D6E3E;padding:1px 6px;border-radius:10px;flex-shrink:0;font-weight:700}
.expense-meta{font-size:11px;color:var(--muted)}
.expense-amount{text-align:right;flex-shrink:0}
.expense-amount .amount{font-size:14px;font-weight:700}
.expense-amount .amount.personal{color:var(--green)}
.expense-amount .arrow{font-size:10px;color:#CCC;margin-top:2px}

/* ── 연간 요약 ── */
.year-hero{background:var(--dark);border-radius:20px;padding:22px 22px 18px;margin-bottom:12px}
.year-hero .label{color:var(--muted);font-size:11px;letter-spacing:.4px;margin-bottom:5px}
.year-hero .amount{color:#F5EFE6;font-size:32px;font-weight:900;letter-spacing:-1.5px;margin-bottom:14px}
.year-hero .amount span{font-size:15px;font-weight:400;letter-spacing:0}
.year-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.year-stat{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.year-stat .s-label{color:#666;font-size:10px;margin-bottom:3px}
.year-stat .s-val{font-size:14px;font-weight:700;color:#F5EFE6}
.year-stat .s-val.green{color:#5AB88A}

.month-card{background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:8px;cursor:pointer;border:1.5px solid var(--lite);transition:transform .1s}
.month-card:active{transform:scale(.98)}
.month-card.over{border-color:var(--red-light)}
.month-card.empty{opacity:.4}
.month-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.month-card-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.over-badge{font-size:10px;background:var(--red-light);color:var(--red);padding:1px 7px;border-radius:10px;font-weight:700}
.month-card-net{font-size:16px;font-weight:700}
.month-card-net.over{color:var(--red)}
.month-card-meta{font-size:11px;color:var(--muted);display:flex;gap:10px}
.month-card-bar{margin-top:10px;height:4px;background:var(--lite);border-radius:2px;overflow:hidden}
.month-card-bar-fill{height:100%;border-radius:2px;transition:width .5s}

/* ── ADD 폼 ── */
#add-sheet{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
#add-sheet.open{pointer-events:all}
#add-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .3s}
#add-sheet.open #add-overlay{background:rgba(0,0,0,.5)}
#add-panel{background:var(--bg);border-radius:24px 24px 0 0;padding:0 18px 36px;max-height:92vh;overflow-y:auto;scrollbar-width:none;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);position:relative;z-index:1;max-width:520px;width:100%;margin:0 auto;left:0;right:0}
#add-sheet.open #add-panel{transform:translateY(0)}
#add-panel::-webkit-scrollbar{display:none}
.sheet-handle{width:36px;height:4px;background:var(--lite);border-radius:2px;margin:12px auto 20px}
.sheet-title{font-size:17px;font-weight:700;margin-bottom:20px}
.form-label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;display:block;margin-bottom:6px;text-transform:uppercase}
.form-input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--lite);background:var(--surface);font-size:14px;font-family:var(--ff);color:var(--dark);outline:none;transition:border-color .15s;display:block;margin-bottom:16px}
.form-input:focus{border-color:var(--coral)}
.form-input.amount-input{font-size:22px;font-weight:700}
.preset-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.preset-btn{border:1px solid var(--lite);background:var(--surface);color:var(--muted);border-radius:20px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:var(--ff);transition:all .15s}
.preset-btn.active{background:var(--dark);color:#F5EFE6;border-color:var(--dark);font-weight:700}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.pay-btn{border:2px solid var(--lite);background:var(--surface);color:var(--muted);border-radius:12px;padding:12px 6px;font-size:12px;cursor:pointer;font-family:var(--ff);text-align:center;transition:all .15s;line-height:1.5}
.pay-btn.active-coral{border-color:var(--coral);background:#FDF2EC;color:var(--coral);font-weight:700}
.pay-btn.active-lg{border-color:var(--lg);background:#EBF0FD;color:var(--lg);font-weight:700}
.toggle-row{background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:14px;border:1.5px solid var(--lite);transition:all .2s}
.toggle-row.on{background:var(--green-light);border-color:#AADDC0}
.toggle-track{width:44px;height:24px;border-radius:12px;background:var(--lite);position:relative;transition:background .2s;flex-shrink:0}
.toggle-track.on{background:var(--green)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#FFF;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-track.on .toggle-thumb{left:23px}
.toggle-text .t-title{font-size:13px;font-weight:700;transition:color .2s}
.toggle-text .t-sub{font-size:11px;color:var(--muted)}
.person-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.person-btn{border:2px solid var(--lite);background:var(--surface);color:var(--muted);border-radius:12px;padding:11px;font-size:14px;cursor:pointer;font-family:var(--ff);text-align:center;transition:all .15s;font-weight:400}
.person-btn.active{border-color:var(--green);background:var(--green-light);color:var(--green);font-weight:700}
.submit-btn{width:100%;padding:15px;border-radius:14px;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--ff);transition:all .2s}
.submit-btn.ready{background:var(--dark);color:#F5EFE6}
.submit-btn.disabled{background:var(--lite);color:var(--muted);cursor:not-allowed}

/* ── 상세 뷰 ── */
#detail-sheet{position:fixed;inset:0;z-index:200;background:var(--bg);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;scrollbar-width:none}
#detail-sheet.open{transform:translateX(0)}
#detail-sheet::-webkit-scrollbar{display:none}
.detail-header{background:var(--dark);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0}
.detail-header .back{background:none;border:none;color:#777;font-size:22px;cursor:pointer;font-family:var(--ff);padding:4px}
.detail-header .del{background:none;border:none;color:var(--red);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--ff)}
.detail-body{max-width:460px;margin:0 auto;padding:24px 16px 40px}
.detail-hero{background:var(--surface);border-radius:20px;padding:28px 20px;text-align:center;margin-bottom:14px;border:1px solid var(--lite)}
.detail-emoji{font-size:44px;margin-bottom:12px}
.detail-item-name{font-size:20px;font-weight:700;margin-bottom:6px}
.detail-amount{font-size:34px;font-weight:900;letter-spacing:-1px}
.detail-amount span{font-size:17px;font-weight:400}
.detail-amount.personal{color:var(--green)}
.detail-personal-note{margin-top:8px;font-size:12px;color:var(--green);font-weight:600}
.detail-rows .row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--lite)}
.detail-rows .row:last-child{border-bottom:none}
.detail-rows .row .k{color:var(--muted);font-size:13px}
.detail-rows .row .v{font-weight:600;font-size:13px}

/* ── 빈 상태 ── */
.empty{text-align:center;color:#C0BDB8;padding:48px 0;font-size:13px}

/* ── 섹션 헤더 ── */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-title{font-size:13px;font-weight:700}
.section-meta{font-size:11px;color:var(--muted)}

/* ── 로딩 ── */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;font-size:14px;color:var(--muted);font-family:var(--ff)}

/* ── 페이지 컨텐츠 ── */
.page{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page.active{display:block}
.page-inner{max-width:460px;margin:0 auto;padding:16px 16px 20px}

/* ── 토스트 ── */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#F5EFE6;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:all .3s;z-index:300;white-space:nowrap;pointer-events:none;font-family:var(--ff)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="loading">불러오는 중…</div>
<div id="toast"></div>

<!-- 헤더 -->
<div id="header">
  <div class="title">🏠 우리 생활비</div>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <span id="month-label"></span>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <button class="sync-btn" onclick="syncNow()">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-label">동기화</span>
  </button>
</div>

<!-- 페이지: 대시보드 -->
<div class="page active" id="page-dash">
  <div class="page-inner" id="dash-content"></div>
</div>

<!-- 페이지: 내역 -->
<div class="page" id="page-list">
  <div class="page-inner" id="list-content"></div>
</div>

<!-- 페이지: 연간 -->
<div class="page" id="page-year">
  <div class="page-inner" id="year-content"></div>
</div>

<!-- 탭 -->
<div id="tabs">
  <button class="tab active" onclick="switchTab('dash')" id="tab-dash">
    <span class="tab-icon">📊</span>대시보드
  </button>
  <button class="tab" onclick="switchTab('list')" id="tab-list">
    <span class="tab-icon">📋</span>내역
  </button>
  <button class="tab" onclick="switchTab('year')" id="tab-year">
    <span class="tab-icon">📅</span>연간
  </button>
  <button class="tab" onclick="openAdd()" id="tab-add">
    <span class="tab-icon">＋</span>추가
  </button>
</div>

<!-- ADD 시트 -->
<div id="add-sheet">
  <div id="add-overlay" onclick="closeAdd()"></div>
  <div id="add-panel">
    <div class="sheet-handle"></div>
    <div class="sheet-title">지출 추가</div>
    <label class="form-label">날짜</label>
    <input type="date" id="f-date" class="form-input">
    <label class="form-label">항목</label>
    <div class="preset-grid" id="presets"></div>
    <input type="text" id="f-item" class="form-input" placeholder="직접 입력…">
    <label class="form-label">금액 (원)</label>
    <input type="text" inputmode="numeric" id="f-amount" class="form-input amount-input" placeholder="0">
    <label class="form-label">결제 수단</label>
    <div class="pay-grid">
      <button class="pay-btn active-coral" id="pay-chung" onclick="setPay('card_chung')">💳<br>청호나이스</button>
      <button class="pay-btn" id="pay-lg" onclick="setPay('card_lg')">💳<br>LG 카드</button>
    </div>
    <div class="toggle-row" id="personal-toggle" onclick="togglePersonal()">
      <div class="toggle-track" id="toggle-track"><div class="toggle-thumb"></div></div>
      <div class="toggle-text">
        <div class="t-title" id="toggle-title">개인 지출</div>
        <div class="t-sub">카드로 결제했지만 따로 입금할 금액</div>
      </div>
    </div>
    <div id="person-section" style="display:none">
      <label class="form-label">누구 지출?</label>
      <div class="person-grid">
        <button class="person-btn" id="person-js" onclick="setPerson('준서')">준서</button>
        <button class="person-btn" id="person-yr" onclick="setPerson('예림')">예림</button>
      </div>
    </div>
    <label class="form-label">비고 (선택)</label>
    <input type="text" id="f-note" class="form-input" placeholder="메모…" style="margin-bottom:24px">
    <button class="submit-btn disabled" id="submit-btn" onclick="submitExpense()">추가하기</button>
  </div>
</div>

<!-- 상세 시트 -->
<div id="detail-sheet">
  <div class="detail-header">
    <button class="back" onclick="closeDetail()">‹</button>
    <span style="color:#F5EFE6;font-size:15px;font-weight:700">지출 상세</span>
    <div style="display:flex;gap:12px;align-items:center">
      <button style="background:none;border:none;color:#AAA;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--ff)" onclick="editExpense()">수정</button>
      <button class="del" onclick="deleteExpense()">삭제</button>
    </div>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<script>
// ══════════════════════════════════════════════════════
// 데이터 & 설정
// ══════════════════════════════════════════════════════
const STORAGE_KEY = 'couple_shared_v1';
const WARN = 350000;

const SEED = [
  {id:"s0", date:"2026-05-01",item:"카페",       amt:3500,  pay:"card_chung",p:false,who:"",note:""},
  {id:"s1", date:"2026-05-02",item:"외식",       amt:53000, pay:"card_chung",p:false,who:"",note:"각자 현금 넣어둠"},
  {id:"s2", date:"2026-05-02",item:"카페",       amt:10000, pay:"card_chung",p:false,who:"",note:""},
  {id:"s3", date:"2026-05-02",item:"카페",       amt:2900,  pay:"card_chung",p:false,who:"",note:""},
  {id:"s4", date:"2026-05-02",item:"카페",       amt:6700,  pay:"card_chung",p:false,who:"",note:""},
  {id:"s5", date:"2026-05-03",item:"외식",       amt:33900, pay:"card_chung",p:false,who:"",note:""},
  {id:"s6", date:"2026-05-03",item:"카페",       amt:5700,  pay:"card_chung",p:false,who:"",note:""},

// 스토리지 (공유)
// ══════════════════════════════════════════════════════
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const stored = JSON.parse(raw);
      const ids = new Set(stored.map(e => e.id));
      expenses = [...stored, ...SEED.filter(e => !ids.has(e.id))];
    } else {
      expenses = [...SEED];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    }
  } catch(e) { expenses = [...SEED]; }
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses)); } catch(e) {}
}

function syncNow(quiet = false) {
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  dot.classList.add('syncing');
  // localStorage는 같은 기기 내 즉시 동기화
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const remote = JSON.parse(raw);
      const ids = new Set(expenses.map(e => e.id));
      const merged = [...expenses];
      let added = 0;
      remote.forEach(e => { if (!ids.has(e.id)) { merged.push(e); added++; } });
      if (added > 0) {
        expenses = merged;
        saveData();
        renderAll();
        if (!quiet) showToast(`${added}개 새 항목 동기화됨 ✓`);
      } else {
        if (!quiet) showToast('저장됨 ✓');
      }
    }
  } catch(e) {}
  dot.classList.remove('syncing');
  lbl.textContent = now();
}

function now() {
  return new Date().toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'});
}

// 30초마다 자동 동기화
// 30초마다 저장 상태 확인
setInterval(() => syncNow(true), 30000);

function renderList() {

  const items = mExp.filter(e=>
    currentFilter==='all'?true:
    currentFilter==='personal'?e.p:
    e.pay===currentFilter
  ).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));

  const totalAmt = mExp.reduce((s,e)=>s+e.amt,0);
  document.getElementById('list-content').innerHTML = `
    <div class="section-header">
      <span class="section-title">지출 내역</span>
      <span class="section-meta">${mExp.length}건 · ${fmt(totalAmt)}원</span>
    </div>
    <div class="filter-row">
      ${filters.map(([k,l])=>`<button class="chip ${currentFilter===k?'active':''}" onclick="setFilter('${k}')">${l}</button>`).join('')}
    </div>
    ${items.length===0?'<div class="empty">내역이 없어요 🌿</div>':items.map(e=>expenseRow(e)).join('')}

}

// ── 연간 탭 ────────────────────────────────────────────
function renderYear() {
  const yr = currentMonth.slice(0,4);
  const today = new Date().toISOString().slice(0,7);

  // 해당 연도 1~12월 전부
  const months = [];
  for(let m=1;m<=12;m++) {
    months.push(`${yr}-${String(m).padStart(2,'0')}`);
  }

  const stats = months.map(mk=>{
    const me = expenses.filter(e=>mKey(e.date)===mk);
    const tot = me.reduce((s,e)=>s+e.amt,0);
    const per = me.filter(e=>e.p).reduce((s,e)=>s+e.amt,0);
    return {mk, tot, per, net:tot-per, cnt:me.length};
  });

  const yearNet = stats.reduce((s,m)=>s+m.net,0);
  const yearTot = stats.reduce((s,m)=>s+m.tot,0);
  const yearPer = stats.reduce((s,m)=>s+m.per,0);

  document.getElementById('year-content').innerHTML = `
    <div class="year-hero">
      <div class="label">${yr}년 실제 커플 지출 합계</div>
      <div class="amount">${fmt(yearNet)}<span>원</span></div>
      <div class="year-stats">
        <div class="year-stat">
          <div class="s-label">총 지출</div>
          <div class="s-val">${fmt(yearTot)}원</div>
        </div>
        <div class="year-stat">
          <div class="s-label">↩ 개인 정산</div>
          <div class="s-val green">${fmt(yearPer)}원</div>
        </div>
      </div>
    </div>
    ${stats.map(s=>{
      const over = s.net>=WARN;
      const empty = s.tot===0;
      return `
        <div class="month-card ${over?'over':''} ${empty?'empty':''}" onclick="goMonth('${s.mk}')">
          <div class="month-card-top">
            <div class="month-card-name">
              ${parseInt(s.mk.slice(5))}월
              ${over?'<span class="over-badge">초과</span>':''}
            </div>
            <div class="month-card-net ${over?'over':''}">${empty?'<span style="font-size:12px;color:var(--muted)">기록 없음</span>':`${fmt(s.net)}원`}</div>
          </div>
          ${!empty?`
          <div class="month-card-meta">
            <span>총 ${fmt(s.tot)}원</span>
            ${s.per>0?`<span style="color:var(--green)">↩ 개인 ${fmt(s.per)}원</span>`:''}
            <span>${s.cnt}건</span>
          </div>
          <div class="month-card-bar">
            <div class="month-card-bar-fill" style="width:${Math.min(s.net/WARN*100,100)}%;background:${over?'var(--red)':'var(--coral)'}"></div>
          </div>`:''}
        </div>`;
    }).join('')}
  `;
}

function goMonth(mk) {
  currentMonth = mk;
  switchTab('dash');
}

// ── 공통 항목 렌더 ───────────────────────────────────────
function expenseRow(e) {
  const payLabel = e.pay==='card_chung'?'청호나이스':e.pay==='card_lg'?'LG카드':'현금';
  return `
    <div class="expense-item ${e.p?'personal':''}" onclick="openDetail('${e.id}')">
      <div class="expense-icon">${gIcon(e.item)}</div>
      <div class="expense-info">
        <div class="expense-name">
          ${e.item}
          ${e.p?`<span class="personal-badge">${e.who||'개인'}</span>`:''}
        </div>
        <div class="expense-meta">${e.date.slice(5).replace('-','/')} · ${payLabel}${e.note?` · ${e.note}`:''}</div>
      </div>
      <div class="expense-amount">
        <div class="amount ${e.p?'personal':''}">${fmt(e.amt)}원</div>
        <div class="arrow">›</div>
      </div>
    </div>`;
}

// ══════════════════════════════════════════════════════
// 탭 / 월 네비게이션
// ══════════════════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  currentTab = tab;
  if(tab==='dash') renderDash();
  else if(tab==='list') renderList();
  else if(tab==='year') renderYear();
}

function changeMonth(dir) {
  const [y,m] = currentMonth.split('-').map(Number);
  const d = new Date(y, m-1+dir, 1);
  currentMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  renderAll();
}

function setFilter(f) {
  currentFilter = f;
  renderList();
}

// 추가 폼
// ══════════════════════════════════════════════════════
function openAdd() {
  // 프리셋 렌더
  document.getElementById('presets').innerHTML = PRESETS.map(p=>
    `<button class="preset-btn" onclick="selectPreset('${p.l}')">${p.i} ${p.l}</button>`
  ).join('');
  // 날짜 오늘로
  document.getElementById('f-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('f-item').value = '';
  document.getElementById('f-amount').value = '';
  document.getElementById('f-note').value = '';
  fPay='card_chung'; fPersonal=false; fPerson='';
  updatePayUI(); updatePersonalUI(); updateSubmitBtn();
  document.getElementById('add-sheet').classList.add('open');

  document.getElementById('f-item').addEventListener('input', updateSubmitBtn);
  document.getElementById('f-amount').addEventListener('input', function() {
    const raw = this.value.replace(/[^0-9]/g,'');
    if(raw) this.value = parseInt(raw).toLocaleString('ko-KR');
    else this.value = '';
    updateSubmitBtn();
  });
}
function closeAdd() { document.getElementById('add-sheet').classList.remove('open'); }

function selectPreset(label) {
  document.getElementById('f-item').value = label;
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.toggle('active', b.textContent.includes(label)));
  if(label==='개인') { fPersonal=true; updatePersonalUI(); }
  updateSubmitBtn();
}
function setPay(p) { fPay=p; updatePayUI(); }
function updatePayUI() {
  document.getElementById('pay-chung').className = 'pay-btn'+(fPay==='card_chung'?' active-coral':'');
  document.getElementById('pay-lg').className = 'pay-btn'+(fPay==='card_lg'?' active-lg':'');
}
function togglePersonal() {
  fPersonal = !fPersonal;
  if(!fPersonal) fPerson='';
  updatePersonalUI();
}
function updatePersonalUI() {
  const track = document.getElementById('toggle-track');
  const row = document.getElementById('personal-toggle');
  const title = document.getElementById('toggle-title');
  const sec = document.getElementById('person-section');
  track.className = 'toggle-track'+(fPersonal?' on':'');
  row.className = 'toggle-row'+(fPersonal?' on':'');
  title.style.color = fPersonal?'var(--green)':'var(--dark)';
  sec.style.display = fPersonal?'block':'none';
  document.querySelectorAll('.person-btn').forEach(b=>b.classList.remove('active'));
  updateSubmitBtn();
}
function setPerson(p) {
  fPerson=p;
  document.getElementById('person-js').className='person-btn'+(p==='준서'?' active':'');
  document.getElementById('person-yr').className='person-btn'+(p==='예림'?' active':'');
  updateSubmitBtn();
}
function updateSubmitBtn() {
  const item = document.getElementById('f-item').value.trim();
  const rawAmt = document.getElementById('f-amount').value.replace(/,/g,'');
  const btn = document.getElementById('submit-btn');
  const whoOk = !fPersonal || fPerson !== '';
  const ok = item && rawAmt && parseInt(rawAmt)>0 && whoOk;
  btn.className = 'submit-btn '+(ok?'ready':'disabled');
  btn.textContent = (fPersonal && !fPerson) ? '누구 지출인지 선택해주세요' : '추가하기';
}
function submitExpense() {
  const item = document.getElementById('f-item').value.trim();
  const amt = parseInt(document.getElementById('f-amount').value.replace(/,/g,''));
  if(!item || !amt) return;
  const entry = {
    id: Date.now().toString(),
    date: document.getElementById('f-date').value,
    item, amt, pay: fPay,
    p: fPersonal, who: fPerson,
    note: document.getElementById('f-note').value.trim()
  };
  expenses.unshift(entry);
  saveData();
  closeAdd();
  renderAll();
  showToast('추가됐어요 ✓');
}

// ══════════════════════════════════════════════════════
// 상세
// ══════════════════════════════════════════════════════
function openDetail(id) {
  selectedId = id;
  const e = expenses.find(x=>x.id===id);
  if(!e) return;
  const payLabel = e.pay==='card_chung'?'청호나이스 카드':e.pay==='card_lg'?'LG 카드':'현금';
  document.getElementById('detail-body').innerHTML = `
    <div class="detail-hero">
      <div class="detail-emoji">${gIcon(e.item)}</div>
      <div class="detail-item-name">${e.item}</div>
      <div class="detail-amount ${e.p?'personal':''}">${fmt(e.amt)}<span>원</span></div>
      ${e.p?`<div class="detail-personal-note">👤 개인 지출 — 정산 예정${e.who?' ('+e.who+')':''}</div>`:''}
    </div>
    <div class="card detail-rows">
      <div class="row"><span class="k">날짜</span><span class="v">${e.date.slice(5).replace('-','/')}</span></div>
      <div class="row"><span class="k">결제수단</span><span class="v">${payLabel}</span></div>
      <div class="row"><span class="k">유형</span><span class="v">${e.p?'개인 지출':'커플 공동 지출'}</span></div>
      ${e.note?`<div class="row"><span class="k">비고</span><span class="v">${e.note}</span></div>`:''}
    </div>
  `;
  document.getElementById('detail-sheet').classList.add('open');
}
function closeDetail() { document.getElementById('detail-sheet').classList.remove('open'); }

function editExpense() {
  const e = expenses.find(x=>x.id===selectedId);
  if(!e) return;
  closeDetail();
  // 폼에 기존 데이터 채우기
  setTimeout(()=>{
    document.getElementById('presets').innerHTML = PRESETS.map(p=>
      `<button class="preset-btn${e.item===p.l?' active':''}" onclick="selectPreset('${p.l}')">${p.i} ${p.l}</button>`
    ).join('');
    document.getElementById('f-date').value = e.date;
    document.getElementById('f-item').value = e.item;
    document.getElementById('f-amount').value = e.amt.toLocaleString('ko-KR');
    document.getElementById('f-note').value = e.note;
    fPay = e.pay; fPersonal = e.p; fPerson = e.who;
    updatePayUI(); updatePersonalUI();
    if(e.who) {
      document.getElementById('person-js').className='person-btn'+(e.who==='준서'?' active':'');
      document.getElementById('person-yr').className='person-btn'+(e.who==='예림'?' active':'');
    }
    // 수정 모드: 저장 시 기존 항목 교체
    const btn = document.getElementById('submit-btn');
    btn.textContent = '수정 저장하기';
    btn.onclick = () => {
      const item = document.getElementById('f-item').value.trim();
      const amt = parseInt(document.getElementById('f-amount').value.replace(/,/g,''));
      if(!item||!amt) return;
      const idx = expenses.findIndex(x=>x.id===selectedId);
      if(idx>-1) {
        expenses[idx] = { ...expenses[idx], date:document.getElementById('f-date').value, item, amt, pay:fPay, p:fPersonal, who:fPerson, note:document.getElementById('f-note').value.trim() };
        saveData(); closeAdd(); renderAll(); showToast('수정됐어요 ✓');
      }
      // 버튼 원상복구
      btn.onclick = submitExpense;
    };
    document.getElementById('add-sheet').classList.add('open');
    document.getElementById('f-item').addEventListener('input', updateSubmitBtn);
    document.getElementById('f-amount').addEventListener('input', function() {
      const raw = this.value.replace(/[^0-9]/g,'');
      if(raw) this.value = parseInt(raw).toLocaleString('ko-KR');
      else this.value = '';
      updateSubmitBtn();
    });
    updateSubmitBtn();
  }, 300);
}
function deleteExpense() {
  if(!selectedId) return;
  showConfirm('이 항목을 삭제할까요?', () => {
    expenses = expenses.filter(e=>e.id!==selectedId);
    saveData();
    closeDetail();
    renderAll();
    showToast('삭제됐어요 🗑');
  });
}

function showConfirm(msg, onOk) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:20px;padding:24px 20px;width:100%;max-width:300px;text-align:center;font-family:'Noto Sans KR',sans-serif">
      <div style="font-size:15px;font-weight:700;margin-bottom:8px;color:#1E1A17">${msg}</div>
      <div style="font-size:13px;color:#A09890;margin-bottom:20px">삭제 후 복구가 안 돼요</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button id="confirm-cancel" style="padding:12px;border-radius:12px;border:1.5px solid #EAE3D8;background:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;color:#A09890">취소</button>
        <button id="confirm-ok" style="padding:12px;border-radius:12px;border:none;background:#D63030;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif">삭제</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#confirm-cancel').onclick = () => document.body.removeChild(overlay);
  overlay.querySelector('#confirm-ok').onclick = () => { document.body.removeChild(overlay); onOk(); };
}

// ══════════════════════════════════════════════════════
// 유틸
// ══════════════════════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ══════════════════════════════════════════════════════
// 초기화
// ══════════════════════════════════════════════════════
(() => {
  loadData();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('sync-label').textContent = now();
  renderAll();
})();
</script>
</body>
</html>
